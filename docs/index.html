<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视觉扩散策略的压缩与边缘部署 · HomeBot-WM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root{
    --fg:#1f2328; --muted:#5f6b7a; --accent:#2563eb; --bg:#ffffff;
    --code-bg:#f6f8fa; --border:#d8dee4; --soft:#f9fafb;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; color:var(--fg); background:var(--bg); line-height:1.75;
    font-family:-apple-system,BlinkMacSystemFont,"Songti SC","Times New Roman",serif;
  }
  .wrap{max-width:920px; margin:0 auto; padding:2.2rem 1.4rem 5rem;}
  header.site{border-bottom:2px solid var(--accent); padding-bottom:1rem; margin-bottom:1.2rem;}
  header.site h1{font-size:1.65rem; margin:0 0 .35rem; line-height:1.3;}
  header.site .sub{color:var(--muted); font-size:.92rem;}
  nav.tabs{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:0 0 2rem;}
  nav.tabs button{
    font:inherit; font-size:.9rem; padding:.4rem .95rem; border:1px solid var(--border);
    background:#fff; border-radius:7px; cursor:pointer; color:var(--muted); transition:all .15s;
  }
  nav.tabs button:hover{border-color:var(--accent); color:var(--accent);}
  nav.tabs button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  nav.tabs .back{margin-left:auto; font-size:.85rem; color:var(--muted); text-decoration:none;}
  nav.tabs .back:hover{color:var(--accent);}
  nav.tabs .gh{font-size:.85rem; color:var(--muted); text-decoration:none;}
  nav.tabs .gh:hover{color:var(--accent);}
  .content{font-size:1rem;}
  .content h1{font-size:1.5rem; border-bottom:1px solid var(--border); padding-bottom:.35rem; margin-top:1.6rem;}
  .content h2{font-size:1.28rem; margin-top:2.2rem; padding-left:.6rem; border-left:4px solid var(--accent); line-height:1.3;}
  .content h3{font-size:1.08rem; margin-top:1.6rem;}
  .content p{margin:.85rem 0;}
  .content table{border-collapse:collapse; width:100%; margin:1.2rem 0; font-size:.88rem; display:block; overflow-x:auto;}
  .content th,.content td{border:1px solid var(--border); padding:.45rem .7rem; text-align:left; vertical-align:top;}
  .content th{background:var(--code-bg); font-weight:600;}
  .content tr:nth-child(even) td{background:var(--soft);}
  .content code{background:var(--code-bg); padding:.12rem .35rem; border-radius:4px; font-size:.85em;
    font-family:"SF Mono",Menlo,Consolas,monospace;}
  .content pre{background:var(--code-bg); padding:.9rem 1rem; border-radius:8px; overflow-x:auto; margin:1.1rem 0;}
  .content pre code{background:none; padding:0; font-size:.82rem;}
  .content blockquote{border-left:3px solid var(--accent); margin:1.1rem 0; padding:.4rem 1.1rem;
    color:var(--muted); background:var(--soft); border-radius:0 6px 6px 0;}
  .content blockquote p{margin:.4rem 0;}
  .content a{color:var(--accent); text-decoration:none;}
  .content a:hover{text-decoration:underline;}
  .content hr{border:none; border-top:1px solid var(--border); margin:2rem 0;}
  .content ul,.content ol{padding-left:1.5rem;}
  .content li{margin:.3rem 0;}
  .mermaid-slot{text-align:center; margin:1.6rem 0; overflow-x:auto;}
  .mermaid-slot svg{max-width:100%; height:auto;}
  .loading{color:var(--muted); font-style:italic;}
  .err{color:#dc3545;}
  footer{margin-top:3rem; padding-top:1.2rem; border-top:1px solid var(--border);
    color:var(--muted); font-size:.82rem; text-align:center;}
  @media(max-width:600px){ .wrap{padding:1.4rem 1rem 3rem;} header.site h1{font-size:1.35rem;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>视觉扩散策略的压缩与边缘部署</h1>
    <div class="sub">HomeBot-WM 主线实验报告 · Diffusion Policy (image Push-T, 262M) → Jetson AGX Orin</div>
  </header>
  <nav class="tabs">
    <button data-doc="README" class="active">报告</button>
    <button data-doc="METHODOLOGY">方法</button>
    <button data-doc="PROBLEMS">问题记录</button>
    <a class="back" href="https://ranpin.github.io/edge-ai-docs/#robot">← 返回技术文档</a>
    <a class="gh" href="https://github.com/ranpin/homebot-wm/tree/main/docs/compression" target="_blank" rel="noopener">GitHub 源 ↗</a>
  </nav>
  <div class="content" id="content"><p class="loading">加载中…</p></div>
  <footer>载体任务 Push-T 为 2D 仿真 · 精度数字为 pymunk 闭环 mean_score (n=50) · TensorRT/Orin 实测待硬件</footer>
</div>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad:false, theme:'neutral', securityLevel:'loose' });

  const GH_BASE = 'https://github.com/ranpin/homebot-wm/tree/main/docs/compression/';
  const content = document.getElementById('content');
  const buttons = [...document.querySelectorAll('nav.tabs button')];

  function switchTab(doc){
    buttons.forEach(b=>b.classList.toggle('active', b.dataset.doc===doc));
    load(doc);
  }

  async function load(doc){
    content.innerHTML = '<p class="loading">加载中…</p>';
    let md;
    try{
      const res = await fetch('compression/'+doc+'.md', {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      md = await res.text();
    }catch(e){
      content.innerHTML = '<p class="err">加载 '+doc+'.md 失败：'+e.message+
        '（本地直接打开 index.html 会因 file:// 跨域失败，请通过 GitHub Pages 或本地 http 服务访问）</p>';
      return;
    }

    // 抽出 mermaid 代码块，用占位 div 替代；稍后用 mermaid.render(代码字符串) 直接渲染，
    // 避开「把含 <br/> 的图塞进 <pre> 再读 textContent」的转义坑。
    const codes = [];
    const prepped = md.replace(/```mermaid\r?\n([\s\S]*?)```/g, (_,code)=>{
      codes.push(code);
      return '<div class="mermaid-slot" data-idx="'+(codes.length-1)+'"></div>';
    });

    content.innerHTML = marked.parse(prepped);

    // 文档间 .md 链接 -> 切 tab；scripts/ eval/ 等 -> GitHub
    content.querySelectorAll('a[href]').forEach(a=>{
      const h = a.getAttribute('href') || '';
      const m = h.match(/^(README|METHODOLOGY|PROBLEMS)\.md$/);
      if(m){ a.addEventListener('click',e=>{e.preventDefault(); switchTab(m[1]);}); return; }
      if(/^(scripts|eval)(\/|#|$)/.test(h) || h.startsWith('./')){
        a.href = GH_BASE + h.replace(/^\.\//,''); a.target='_blank'; a.rel='noopener';
      }
    });

    // 渲染 mermaid
    for(let i=0;i<codes.length;i++){
      const slot = content.querySelector('.mermaid-slot[data-idx="'+i+'"]');
      if(!slot) continue;
      try{
        const {svg} = await mermaid.render('mmd-'+doc+'-'+i, codes[i]);
        slot.innerHTML = svg;
      }catch(e){
        slot.innerHTML = '<p class="err">[mermaid 渲染失败: '+e.message+']</p>';
      }
    }
    window.scrollTo({top:0, behavior:'smooth'});
  }

  buttons.forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.doc)));
  load('README');
</script>
</body>
</html>
