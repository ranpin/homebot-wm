<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视觉扩散策略的压缩与边缘部署 · HomeBot-WM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<!-- 共享演示页外壳（配色/页头/章节/按钮/页脚统一，单一事实源在主站 public/demo-shell.css） -->
<link rel="stylesheet" href="https://ranpin.github.io/demo-shell.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  /* 仅保留本页 Demo tab 专属的视觉元素；结构色一律引用外壳的 --ds-* 变量 */
  .demo-wrap{font-size:.98rem;}
  .demo-lead{margin:.3rem 0 1rem;}
  .demo-task{background:var(--ds-panel); border:1px solid var(--ds-border); border-radius:var(--ds-radius); padding:.75rem 1rem; margin:0 0 1rem;}
  .demo-task p{margin:.45rem 0;}
  .demo-warn{border-left:3px solid var(--ds-warn); background:var(--ds-warn-soft); padding:.6rem 1rem; border-radius:0 6px 6px 0;}
  .demo-legend{display:flex; flex-wrap:wrap; gap:.45rem 1.1rem; margin:0 0 1.1rem; font-size:.88rem; color:var(--ds-muted);}
  .demo-legend .lg{display:inline-flex; align-items:center; gap:.4rem;}
  .demo-legend .lg i{width:13px; height:13px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.18); flex:none;}
  figure.demo-fig{margin:.3rem 0 1.3rem; text-align:center;}
  figure.demo-fig video{
    max-width:100%; width:480px; border-radius:10px; border:1px solid var(--ds-border);
    box-shadow:0 2px 14px rgba(0,0,0,.10); background:#000;
  }
  .demo-segs{font-size:.93rem;}
  .demo-segs-t{font-weight:600; margin:.2rem 0 .45rem;}
  .demo-segs ol{margin:.2rem 0 .6rem; padding-left:1.6rem;}
  .demo-segs li{margin:.4rem 0;}
  .demo-note{color:var(--ds-muted); font-size:.86rem; margin-top:.5rem;}
  .mermaid-slot{text-align:center; margin:1.6rem 0; overflow-x:auto;}
  .mermaid-slot svg{max-width:100%; height:auto;}
</style>
</head>
<body>
  <header class="ds-header">
    <div class="ds-header__inner">
      <div class="ds-header__top">
        <a class="ds-home" href="https://ranpin.github.io/">← 返回主页</a>
        <span class="ds-badge">🤖 智能机器人 / 具身智能</span>
      </div>
      <h1>视觉扩散策略的压缩与边缘部署</h1>
      <p class="ds-header__sub">HomeBot-WM 主线实验报告 · Diffusion Policy (image Push-T, 262M) → Jetson AGX Orin</p>
    </div>
  </header>

  <div class="ds-wrap">
    <nav class="ds-nav">
      <button class="ds-tab active" data-doc="DEMO">Demo</button>
      <button class="ds-tab" data-doc="README">报告</button>
      <button class="ds-tab" data-doc="METHODOLOGY">方法</button>
      <button class="ds-tab" data-doc="PROBLEMS">问题记录</button>
      <span class="ds-nav__spacer"></span>
      <a class="ds-navlink" href="https://ranpin.github.io/edge-ai-docs/#robot">← 返回技术文档</a>
      <a class="ds-navlink" href="https://github.com/ranpin/homebot-wm/tree/main/docs/compression" target="_blank" rel="noopener">GitHub 源 ↗</a>
    </nav>

    <div class="ds-content" id="content"><p class="ds-loading">加载中…</p></div>

    <footer class="ds-footer">载体任务 Push-T 为 2D 仿真 · 精度为 pymunk 闭环 mean_score (n=50) · Orin 实测：DDIM-16 FP16=12Hz / INT8=18Hz；TRT 原生 INT8 闭环比 FP16 掉 ~0.12 (p&lt;0.001)</footer>
  </div>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad:false, theme:'neutral', securityLevel:'loose' });

  const GH_BASE = 'https://github.com/ranpin/homebot-wm/tree/main/docs/compression/';
  const content = document.getElementById('content');
  const buttons = [...document.querySelectorAll('.ds-nav .ds-tab')];

  function switchTab(doc){
    buttons.forEach(b=>b.classList.toggle('active', b.dataset.doc===doc));
    load(doc);
  }

  async function load(doc){
    if(doc==='DEMO'){
      content.innerHTML =
        '<div class="demo-wrap">'+
        '<p class="demo-lead">下面 4 段是<b>压缩后策略</b>（Diffusion Policy → <b>DDIM-50 + INT8</b>，最高精度配置）在 Push-T 任务上、4 个不同初始位姿的闭环 rollout（2× 速播放）。</p>'+
        '<div class="demo-task">'+
        '<p><b>任务 Push-T</b>：一个<b>质点 agent</b>（蓝色圆点）把 <b>T 形块</b>（灰色）推去与<b>目标轮廓</b>（绿色）对齐。coverage（覆盖率）= T 块与目标区的重叠比例（0–1），即本任务的 score，≥0.95 记成功。</p>'+
        '<p class="demo-warn">⚠ 画面里<b>没有机械臂 / 机器人本体</b>——Push-T 是 Diffusion Policy 的标准 2D 抽象基准，agent 是直接施力的质点。选它当载体是因为它轻量、能在 8GB 上从头训练，而本项目的交付物是<b>任务无关的压缩方法链</b>（ONNX→INT8→DDIM→TensorRT）。</p>'+
        '</div>'+
        '<div class="demo-legend">'+
        '<span class="lg"><i style="background:#4169E1"></i>agent（质点·施力点）</span>'+
        '<span class="lg"><i style="background:#778899"></i>T 块（被推物体）</span>'+
        '<span class="lg"><i style="background:#90EE90"></i>目标轮廓</span>'+
        '<span class="lg"><i style="background:#FF0000"></i>当前动作指令</span>'+
        '</div>'+
        '<figure class="demo-fig">'+
        '<video controls preload="metadata" src="compression/demo/reel.mp4"></video>'+
        '</figure>'+
        '<div class="demo-segs">'+
        '<p class="demo-segs-t">逐段说明（与视频内「片段 N/4」标识对应）</p>'+
        '<ol>'+
        '<li><b>片段 1</b> · seed 10001 · coverage <b>1.00</b> —— T 块完美对齐目标（满分）。</li>'+
        '<li><b>片段 2</b> · seed 10002 · coverage <b>1.00</b> —— 另一初始位姿，同样满分。</li>'+
        '<li><b>片段 3</b> · seed 10000 · coverage <b>0.96</b> —— 接近完美对齐。</li>'+
        '<li><b>片段 4</b> · seed 10004 · coverage <b>0.72</b> —— 部分对齐（展示非满分情形）。</li>'+
        '</ol>'+
        '<p class="demo-note">同一策略、同一压缩配置，仅初始位姿不同；4 段中 3 段 coverage ≥ 0.96。完整 n=50 统计见「报告」tab。</p>'+
        '<p class="demo-note">注：策略是反应式模仿（行为克隆），无「对齐即停」机制，整个回合持续输出动作；coverage 取回合内最大值，故个别片段末尾把块推出对齐位不会降低该段分数——这是 Push-T + 模仿策略的固有行为，非压缩引入。</p>'+
        '</div>'+
        '</div>';
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    content.innerHTML = '<p class="ds-loading">加载中…</p>';
    let md;
    try{
      const res = await fetch('compression/'+doc+'.md', {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      md = await res.text();
    }catch(e){
      content.innerHTML = '<p class="ds-err">加载 '+doc+'.md 失败：'+e.message+
        '（本地直接打开 index.html 会因 file:// 跨域失败，请通过 GitHub Pages 或本地 http 服务访问）</p>';
      return;
    }

    // 抽出 mermaid 代码块，用占位 div 替代；稍后用 mermaid.render(代码字符串) 直接渲染，
    // 避开「把含 <br/> 的图塞进 <pre> 再读 textContent」的转义坑。
    const codes = [];
    const prepped = md.replace(/```mermaid\r?\n([\s\S]*?)```/g, (_,code)=>{
      codes.push(code);
      return '<div class="mermaid-slot" data-idx="'+(codes.length-1)+'"></div>';
    });

    content.innerHTML = marked.parse(prepped);

    // 文档间 .md 链接 -> 切 tab；scripts/ eval/ 等 -> GitHub
    content.querySelectorAll('a[href]').forEach(a=>{
      const h = a.getAttribute('href') || '';
      const m = h.match(/^(README|METHODOLOGY|PROBLEMS)\.md$/);
      if(m){ a.addEventListener('click',e=>{e.preventDefault(); switchTab(m[1]);}); return; }
      if(/^(scripts|eval)(\/|#|$)/.test(h) || h.startsWith('./')){
        a.href = GH_BASE + h.replace(/^\.\//,''); a.target='_blank'; a.rel='noopener';
      }
    });

    // 渲染 mermaid
    for(let i=0;i<codes.length;i++){
      const slot = content.querySelector('.mermaid-slot[data-idx="'+i+'"]');
      if(!slot) continue;
      try{
        const {svg} = await mermaid.render('mmd-'+doc+'-'+i, codes[i]);
        slot.innerHTML = svg;
      }catch(e){
        slot.innerHTML = '<p class="ds-err">[mermaid 渲染失败: '+e.message+']</p>';
      }
    }
    window.scrollTo({top:0, behavior:'smooth'});
  }

  buttons.forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.doc)));
  load('DEMO');
</script>
</body>
</html>
